name: Generate contribution snake

on:
  schedule:
    # 每天 00:10 UTC（北京时间 08:10）重新生成一次
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 生成浅色和深色两条贡献蛇
        uses: Platane/snk@v3.5
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3E63DD
            dist/snake-light.svg?palette=github-light&color_snake=#3E63DD

      - name: 推送产物到 output 分支
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
